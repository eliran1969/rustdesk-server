# Build and tag the image first (from the repository root):
#   docker buildx build -f docker/Dockerfile.console -t rustdesk-server-console:latest --load .
# Multi-arch: docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile.console -t rustdesk-server-console:latest .
# Data folder (./data) is mapped to /root: id_ed25519, id_ed25519.pub, db_v2.sqlite3.
services:
  hbbs:
    container_name: hbbs
    image: rustdesk-server-console:latest
    command: hbbs
    environment:
      - API_PORT=21114
      # - TRUST_PROXY=Y   # only if the console is reached exclusively via a reverse proxy
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk-server-console:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
